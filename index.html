<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Planeta Ecosistema</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Fredoka+One&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Nunito',sans-serif;
background:radial-gradient(circle at center,#0f172a,#020617);
color:white;
overflow:hidden;
}

.font-title{font-family:'Fredoka One',cursive;}

.screen{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.hidden{display:none}

.btn{
background:#10b981;
padding:12px 20px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
margin-top:10px;
}

.planet{
position:absolute;
border-radius:50%;
cursor:pointer;
transition:0.3s;
}

.planet:hover{transform:scale(1.2)}

.locked{filter:grayscale(1);opacity:0.4}

.correct{background:#047857!important}
.wrong{background:#991b1b!important}

textarea{
width:100%;
height:80px;
border-radius:10px;
padding:10px;
color:black;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro" class="screen">
<h1 class="font-title" style="font-size:40px">🌍 Planeta Ecosistema</h1>
<p>Misión de supervivencia</p>
<button class="btn" onclick="startGame()">🚀 Iniciar</button>
</div>

<!-- MAPA -->
<div id="map" class="screen hidden">

<div id="space"></div>

<button class="btn" style="position:absolute;bottom:20px" onclick="copyAnswers()">
📋 Copiar respuestas
</button>

</div>

<!-- ZONA -->
<div id="zone" class="screen hidden" style="padding:20px">

<h2 id="zoneTitle"></h2>
<img id="zoneImg" style="max-width:300px;border-radius:12px">

<p id="q1"></p>
<div id="options"></div>
<p id="fb1"></p>

<div id="q2block" class="hidden">
<p id="q2"></p>
<textarea id="input"></textarea>
<button class="btn" onclick="answerQ2()">Responder</button>
<p id="fb2"></p>
</div>

<button id="finish" class="btn hidden" onclick="finishZone()">Volver</button>

</div>

<!-- FINAL -->
<div id="final" class="screen hidden">
<h1 class="font-title">🏆 ¡Ecosistema restaurado!</h1>
<div id="summary"></div>
<button class="btn" onclick="location.reload()">Reiniciar</button>
</div>

<script>

let state={
current:-1,
completed:[],
answers:{}
}

// 6 ZONAS
const zones=[
{
title:"Ecosistema",
img:"https://upload.wikimedia.org/wikipedia/commons/6/68/Ecosystem.jpg",
q1:"¿Qué es un ecosistema?",
options:["Seres vivos","Todo el sistema completo","Clima"],
correct:1,
q2:"Define ecosistema"
},
{
title:"Factores abióticos",
img:"https://upload.wikimedia.org/wikipedia/commons/3/3f/Temperature_graph.png",
q1:"Zona óptima es:",
options:["Donde mueren","Donde viven mejor","Máximo calor"],
correct:1,
q2:"¿Qué pasa fuera del rango?"
},
{
title:"Relaciones",
img:"https://upload.wikimedia.org/wikipedia/commons/3/3a/Mutualism.jpg",
q1:"Mutualismo:",
options:["Uno pierde","Ambos ganan","Nadie gana"],
correct:1,
q2:"Pon ejemplo"
},
{
title:"Cadena trófica",
img:"https://upload.wikimedia.org/wikipedia/commons/1/11/Food_chain.svg",
q1:"Orden correcto:",
options:["Productor primero","Consumidor primero","Descomponedor primero"],
correct:0,
q2:"¿Qué pasa si falta uno?"
},
{
title:"Pirámide",
img:"https://upload.wikimedia.org/wikipedia/commons/e/e4/Ecological_pyramid.svg",
q1:"Energía:",
options:["Aumenta","Disminuye","Igual"],
correct:1,
q2:"¿Por qué?"
},
{
title:"Impacto humano",
img:"https://upload.wikimedia.org/wikipedia/commons/5/5f/Deforestation.jpg",
q1:"Daño ambiental:",
options:["Reforestar","Deforestar","Reciclar"],
correct:1,
q2:"Propuesta ecológica"
}
]

// CAMBIAR PANTALLA
function show(id){
["intro","map","zone","final"].forEach(s=>{
document.getElementById(s).classList.add("hidden")
})
document.getElementById(id).classList.remove("hidden")
}

// INICIO
function startGame(){
renderMap()
show("map")
}

// MAPA PLANETA
function renderMap(){
let space=document.getElementById("space")
space.innerHTML=""

zones.forEach((z,i)=>{

let unlocked = i===0 || state.completed.includes(i-1)
let done = state.completed.includes(i)

let p=document.createElement("div")
p.className="planet "+(unlocked?"":"locked")
p.style.width="60px"
p.style.height="60px"
p.style.background="radial-gradient(circle,#10b981,#065f46)"
p.style.left=(100+ i*120)+"px"
p.style.top=(150+ Math.sin(i)*80)+"px"

p.innerHTML=done?"✅":"🌍"

if(unlocked && !done){
p.onclick=()=>enterZone(i)
}

space.appendChild(p)
})
}

// ENTRAR ZONA
function enterZone(i){

// RESET
options.innerHTML=""
fb1.innerHTML=""
fb2.innerHTML=""
input.value=""
q2block.classList.add("hidden")
finish.classList.add("hidden")

state.current=i
let z=zones[i]

zoneTitle.innerText=z.title
zoneImg.src=z.img
q1.innerText=z.q1

z.options.forEach((opt,index)=>{
let b=document.createElement("div")
b.className="btn"
b.innerText=opt
b.onclick=()=>answerQ1(index)
options.appendChild(b)
})

show("zone")
}

// RESPUESTA TEST
function answerQ1(i){
let z=zones[state.current]
let btns=options.children

for(let j=0;j<btns.length;j++){
if(j===z.correct)btns[j].classList.add("correct")
if(j===i && j!==z.correct)btns[j].classList.add("wrong")
}

if(i===z.correct){
fb1.innerText="✅ Correcto"
state.answers["Zona "+(state.current+1)+" Test"]=z.options[i]

q2block.classList.remove("hidden")
q2.innerText=z.q2
}else{
fb1.innerText="❌ Incorrecto"
}
}

// RESPUESTA ABIERTA
function answerQ2(){
let txt=input.value

state.answers["Zona "+(state.current+1)+" Abierta"]=txt

fb2.innerText="Guardado"
finish.classList.remove("hidden")
}

// FINALIZAR ZONA
function finishZone(){
state.completed.push(state.current)

if(state.completed.length===6){
showFinal()
}else{
renderMap()
show("map")
}
}

// FINAL
function showFinal(){
let s=document.getElementById("summary")
s.innerHTML=""

for(let k in state.answers){
s.innerHTML+=`<p>${k}: ${state.answers[k]}</p>`
}

show("final")
}

// COPIAR
function copyAnswers(){
let txt="RESPUESTAS\n\n"

for(let k in state.answers){
txt+=k+":\n"+state.answers[k]+"\n\n"
}

navigator.clipboard.writeText(txt)
alert("Copiado")
}

</script>

</body>
</html>
