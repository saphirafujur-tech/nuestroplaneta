<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Planeta Ecosistema</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Fredoka+One&display=swap" rel="stylesheet">

<style>

html,body{
margin:0;
height:100%;
font-family:'Nunito',sans-serif;
color:white;
overflow:hidden;
}

/* 🌌 FONDO ESPACIAL ANIMADO */
body{
background: radial-gradient(circle at 20% 20%, #0f172a, #020617 80%);
}

/* ESTRELLAS */
.stars{
position:absolute;
width:100%;
height:100%;
background: transparent;
overflow:hidden;
z-index:-1;
}

.star{
position:absolute;
width:2px;
height:2px;
background:white;
opacity:0.8;
animation: twinkle 2s infinite alternate;
}

@keyframes twinkle{
from{opacity:0.2}
to{opacity:1}
}

/* PANTALLAS */
.screen{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
animation: fadeIn 0.6s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:translateY(0)}
}

.hidden{display:none}

/* TITULO */
.title{
font-family:'Fredoka One',cursive;
font-size:38px;
color:#34d399;
text-shadow:0 0 10px rgba(52,211,153,0.6);
}

/* BOTONES */
.btn{
background:#10b981;
color:#022c22;
padding:12px 18px;
border-radius:12px;
cursor:pointer;
margin-top:10px;
font-weight:bold;
border:none;
transition:0.3s;
}

.btn:hover{
background:#34d399;
transform:scale(1.05);
box-shadow:0 0 15px rgba(16,185,129,0.6);
}

/* PLANETAS */
.planet{
position:absolute;
width:70px;
height:70px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-size:24px;

background: radial-gradient(circle, #34d399, #065f46);

box-shadow:
0 0 10px rgba(16,185,129,0.6),
0 0 25px rgba(16,185,129,0.4);

animation: float 4s ease-in-out infinite;
transition:0.3s;
}

@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(-10px)}
100%{transform:translateY(0)}
}

.planet:hover{
transform:scale(1.2);
}

.locked{
filter:grayscale(1);
opacity:0.3;
cursor:not-allowed;
}

/* CAJAS */
.box{
background:rgba(15,23,42,0.85);
border:1px solid #334155;
padding:15px;
border-radius:12px;
margin:10px 0;
width:100%;
max-width:600px;
backdrop-filter: blur(6px);
}

/* RESPUESTAS */
.correct{
background:#065f46!important;
animation: pop 0.3s;
}

.wrong{
background:#7f1d1d!important;
animation: shake 0.3s;
}

@keyframes pop{
0%{transform:scale(0.9)}
100%{transform:scale(1)}
}

@keyframes shake{
0%{transform:translateX(0)}
25%{transform:translateX(-5px)}
75%{transform:translateX(5px)}
100%{transform:translateX(0)}
}

textarea{
width:100%;
border-radius:10px;
padding:10px;
color:black;
}

img{
max-width:300px;
border-radius:12px;
margin:10px;
box-shadow:0 0 15px rgba(0,0,0,0.5);
}

</style>
</head>

<body>

<!-- ⭐ ESTRELLAS -->
<div class="stars" id="stars"></div>

<!-- INTRO -->
<div id="intro" class="screen">
<h1 class="title">🌍 Planeta Ecosistema</h1>
<p>Misión de supervivencia</p>
<button class="btn" onclick="startGame()">🚀 Iniciar</button>
</div>

<!-- MAPA -->
<div id="map" class="screen hidden">
<div id="space" style="position:relative;width:100%;height:80%"></div>
<button class="btn" onclick="copyAnswers()">📋 Copiar respuestas</button>
</div>

<!-- ZONA -->
<div id="zone" class="screen hidden">
<h2 id="zoneTitle"></h2>
<img id="zoneImg">

<div class="box">
<p id="q1"></p>
<div id="options"></div>
<p id="fb1"></p>
</div>

<div id="q2block" class="box hidden">
<p id="q2"></p>
<textarea id="input"></textarea>
<button class="btn" onclick="answerQ2()">Responder</button>
<p id="fb2"></p>
</div>

<button id="finish" class="btn hidden" onclick="finishZone()">Volver al mapa</button>
</div>

<!-- FINAL -->
<div id="final" class="screen hidden">
<h1 class="title">🏆 ¡Ecosistema restaurado!</h1>
<div id="summary"></div>
<button class="btn" onclick="location.reload()">Reiniciar</button>
</div>

<script>

// ⭐ GENERAR ESTRELLAS
const starsContainer = document.getElementById("stars");
for(let i=0;i<80;i++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"%";
s.style.top=Math.random()*100+"%";
s.style.animationDuration=(1+Math.random()*3)+"s";
starsContainer.appendChild(s);
}

// 👉 AQUÍ VA EXACTAMENTE TU MISMO SCRIPT SIN CAMBIOS 👇

// (NO TOCADO, ES TU LÓGICA ORIGINAL)

let state={current:-1,completed:[],answers:{}}

// ... 👇 (todo tu código sigue igual, no lo modifico)

// 🔴 IMPORTANTE:
// DEJA TU SCRIPT TAL COMO LO TENÍAS DESPUÉS DE ESTO

</script>

</body>
</html>
