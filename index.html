<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
margin:0;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:sans-serif;
color:white;
}

/* PLANETA */
.planet{
width:80vmin;
height:80vmin;
border-radius:50%;
background:radial-gradient(circle,#065f46,#022c22);
position:relative;
box-shadow:0 0 80px #10b981;
}

/* NAVE */
.ship{
position:absolute;
font-size:30px;
transition:1s;
}

/* ZONAS */
.zone{
position:absolute;
width:70px;
height:70px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#1e293b;
border:2px solid #10b981;
cursor:pointer;
}

.locked{
opacity:0.3;
cursor:not-allowed;
}

/* MODAL */
.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
justify-content:center;
align-items:center;
}

.card{
background:#1e293b;
padding:20px;
border-radius:10px;
width:300px;
text-align:center;
}

.option{
background:#334155;
margin:5px;
padding:8px;
border-radius:8px;
cursor:pointer;
}

.correct{background:#065f46;}
.wrong{background:#7f1d1d;}

button{
margin-top:10px;
padding:8px;
border-radius:8px;
background:#10b981;
color:black;
}
</style>
</head>

<body>

<div class="planet">

<div id="ship" class="ship">🚀</div>

<div class="zone" style="top:20%;left:40%" onclick="enter(0)">🌱</div>
<div class="zone locked" style="top:40%;left:70%" onclick="enter(1)">🌡️</div>
<div class="zone locked" style="top:70%;left:60%" onclick="enter(2)">🔗</div>
<div class="zone locked" style="top:75%;left:25%" onclick="enter(3)">🌿</div>
<div class="zone locked" style="top:45%;left:10%" onclick="enter(4)">🔺</div>
<div class="zone locked" style="top:15%;left:15%" onclick="enter(5)">🌍</div>

</div>

<div id="modal" class="modal">
<div class="card">
<h3 id="title"></h3>
<p id="q"></p>
<img id="img" style="width:100%;margin:10px 0;border-radius:8px">

<div id="answers"></div>

<textarea id="text" style="display:none;width:100%;color:black"></textarea>

<button onclick="next()">Continuar</button>
</div>
</div>

<script>

let zone=0;
let current=0;
let correct=false;

const data=[
{t:"Ecosistema",type:"test",img:"https://upload.wikimedia.org/wikipedia/commons/6/6b/Forest_ecosystem.jpg",q:"¿Qué es un ecosistema?",a:["Solo seres vivos","Seres vivos + medio + relaciones","Clima"],c:1},
{t:"Factores",type:"test",img:"https://upload.wikimedia.org/wikipedia/commons/3/3f/Tolerance_curve.svg.png",q:"Zona óptima significa:",a:["Mueren","Mejor viven","Nada"],c:1},
{t:"Relaciones",type:"open",img:"https://upload.wikimedia.org/wikipedia/commons/0/0c/Bee_pollinating_flower.jpg",q:"¿Qué relación hay entre abeja y flor?"},
{t:"Cadenas",type:"test",img:"https://upload.wikimedia.org/wikipedia/commons/3/3e/Food_chain.svg.png",q:"Orden correcto:",a:["Productor→consumidor","Consumidor→productor","Azar"],c:0},
{t:"Pirámide",type:"test",img:"https://upload.wikimedia.org/wikipedia/commons/3/3f/Ecological_pyramid.svg.png",q:"¿Qué pasa con la energía?",a:["Se pierde","Aumenta","Nada"],c:0},
{t:"Impacto",type:"open",img:"https://upload.wikimedia.org/wikipedia/commons/e/e5/Deforestation.jpg",q:"Di una acción para proteger el ecosistema"}
];

function enter(i){
if(i>zone) return;

current=i;
correct=false;

let d=data[i];

document.getElementById("modal").style.display="flex";
document.getElementById("title").innerText=d.t;
document.getElementById("q").innerText=d.q;
document.getElementById("img").src=d.img;

let html="";
document.getElementById("text").style.display="none";

if(d.type==="test"){
d.a.forEach((x,ind)=>{
html+=`<div class="option" onclick="check(${ind})">${x}</div>`;
});
}

if(d.type==="open"){
document.getElementById("text").style.display="block";
}

document.getElementById("answers").innerHTML=html;
}

function check(i){
let d=data[current];

if(i===d.c){
correct=true;
alert("✅ Correcto");
}else{
correct=false;
alert("❌ Intenta otra vez");
}
}

function next(){

let d=data[current];

if(d.type==="test" && !correct){
alert("Debes acertar para avanzar");
return;
}

if(d.type==="open"){
let txt=document.getElementById("text").value.trim();
if(txt.length<5){
alert("Escribe una respuesta válida");
return;
}
}

document.getElementById("modal").style.display="none";

zone++;

document.querySelectorAll(".zone")[zone]?.classList.remove("locked");

moveShip(zone);

if(zone>=data.length){
alert("🏆 ¡Planeta restaurado!");
}
}

function moveShip(i){
const pos=[[40,20],[70,40],[60,70],[25,75],[10,45],[15,15]];
let s=document.getElementById("ship");
s.style.left=pos[i][0]+"%";
s.style.top=pos[i][1]+"%";
}

moveShip(0);

</script>

</body>
</html>
