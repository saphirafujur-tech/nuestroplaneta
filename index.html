<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planeta Ecosistema</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Fredoka+One&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Nunito',sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b,#065f46);
  background-size:400% 400%;
  animation: bg 15s infinite;
  color:white;
}
@keyframes bg{
0%,100%{background-position:0%}
50%{background-position:100%}
}
.font-title{font-family:'Fredoka One',cursive}

.correct{background:#047857 !important}
.wrong{background:#991b1b !important}
</style>
</head>

<body class="h-screen flex flex-col">

<!-- INTRO -->
<div id="intro" class="flex flex-col items-center justify-center h-full text-center">
<h1 class="font-title text-5xl text-emerald-300 mb-4">🌍 Planeta Ecosistema</h1>
<p class="mb-6">Restaura el equilibrio del planeta</p>
<button onclick="start()" class="bg-emerald-500 px-6 py-3 rounded-xl font-bold">🚀 Empezar</button>
</div>

<!-- MAPA -->
<div id="map" class="hidden p-6 text-center">
<h2 class="font-title text-3xl mb-4">Mapa del planeta</h2>

<div id="zones" class="grid grid-cols-2 md:grid-cols-3 gap-4 max-w-xl mx-auto"></div>

<p id="score" class="mt-4"></p>
</div>

<!-- ZONA -->
<div id="zone" class="hidden p-6 max-w-xl mx-auto">
<button onclick="back()">⬅ Volver</button>
<h2 id="title" class="font-title text-2xl my-4"></h2>

<div id="question"></div>
<div id="options" class="mt-4 space-y-2"></div>
<div id="feedback" class="mt-4"></div>
</div>

<!-- FINAL -->
<div id="end" class="hidden flex flex-col items-center justify-center h-full">
<h1 class="text-4xl text-yellow-300 mb-4">🏆 ¡Completado!</h1>
<p id="final"></p>
<button onclick="location.reload()" class="bg-emerald-500 px-6 py-3 rounded-xl mt-4">Reiniciar</button>
</div>

<script>
let score=0;
let current=-1;
let completed=[];

const zones=[
{
title:"Ecosistema",
q:"¿Qué es un ecosistema?",
options:["Solo seres vivos","Seres vivos + medio + relaciones","Clima"],
correct:1,
feedback:"Incluye seres vivos, medio físico y relaciones."
},
{
title:"Factores",
q:"¿El agua es?",
options:["Biótico","Abiótico","Ninguno"],
correct:1,
feedback:"El agua no tiene vida."
},
{
title:"Relaciones",
q:"¿Relación depredador?",
options:["Mutualismo","Depredación","Comensalismo"],
correct:1,
feedback:"Uno se come al otro."
},
{
title:"Cadena",
q:"Orden correcto",
options:["Consumidor→Productor","Productor→Consumidor","Descomponedor→Productor"],
correct:1,
feedback:"Siempre empieza en productor."
},
{
title:"Pirámide",
q:"La energía...",
options:["Aumenta","Disminuye","Igual"],
correct:1,
feedback:"Se pierde energía."
},
{
title:"Impacto",
q:"¿Qué daña ecosistemas?",
options:["Reservas","Deforestación","Reforestación"],
correct:1,
feedback:"Destruye hábitats."
}
];

function show(id){
["intro","map","zone","end"].forEach(s=>document.getElementById(s).classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
}

function start(){
renderMap();
show("map");
}

function renderMap(){
let html="";
zones.forEach((z,i)=>{
let unlocked=i===0||completed.includes(i-1);
html+=`
<button onclick="enter(${i})" 
class="p-4 rounded-xl border ${unlocked?'bg-slate-700':'bg-slate-900 opacity-40'}">
${z.title}
</button>`;
});
document.getElementById("zones").innerHTML=html;
document.getElementById("score").innerText="Puntuación: "+score;
}

function enter(i){
if(i!==0 && !completed.includes(i-1)) return;

current=i;
let z=zones[i];

document.getElementById("title").innerText=z.title;
document.getElementById("question").innerText=z.q;

let opts="";
z.options.forEach((o,idx)=>{
opts+=`<div class="p-3 bg-slate-700 rounded-xl cursor-pointer"
onclick="answer(${idx})">${o}</div>`;
});
document.getElementById("options").innerHTML=opts;
document.getElementById("feedback").innerHTML="";

show("zone");
}

function answer(i){
let z=zones[current];
let buttons=document.querySelectorAll("#options div");

buttons.forEach((b,idx)=>{
if(idx===z.correct) b.classList.add("correct");
if(idx===i && idx!==z.correct) b.classList.add("wrong");
});

if(i===z.correct){
score++;
setTimeout(()=>{
completed.push(current);
if(completed.length===6){
end();
}else{
renderMap();
show("map");
}
},1000);
}else{
document.getElementById("feedback").innerText="❌ Incorrecto";
}
}

function back(){
show("map");
}

function end(){
document.getElementById("final").innerText="Puntuación: "+score+"/6";
show("end");
}
</script>

</body>
</html>
