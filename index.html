<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planeta Ecosistema</title>

<style>
/* 🌌 FONDO ESPACIO */
body{
  margin:0;
  font-family:'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, #0f172a, #020617);
  color:white;
  text-align:center;
  overflow:hidden;
}

/* estrellas */
body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url("https://www.transparenttextures.com/patterns/stardust.png");
  animation:stars 60s linear infinite;
  opacity:0.3;
}

@keyframes stars{
  from{background-position:0 0;}
  to{background-position:1000px 1000px;}
}

/* 🌍 INTRO */
#intro{
  padding:40px;
  position:relative;
  z-index:1;
}

.planet{
  width:180px;
  border-radius:50%;
  box-shadow:0 0 40px #22c55e;
  animation:float 4s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}

/* 🚀 BOTONES */
button{
  padding:12px 18px;
  margin:8px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#10b981,#34d399);
  color:#022c22;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
}

/* 🌍 MAPA */
#map{
  display:none;
  padding-top:40px;
}

.zone{
  display:inline-block;
  margin:12px;
  padding:18px;
  border-radius:15px;
  background:rgba(30,41,59,0.8);
  border:2px solid #10b981;
  cursor:pointer;
  transition:0.3s;
  backdrop-filter:blur(6px);
}

.zone:hover{
  transform:scale(1.1);
  box-shadow:0 0 15px #10b981;
}

.locked{
  background:#1e293b;
  border-color:#555;
  opacity:0.4;
  cursor:not-allowed;
}

/* 📘 PREGUNTAS */
#zoneScreen{
  display:none;
  padding:30px;
}

textarea{
  width:80%;
  height:90px;
  border-radius:10px;
  border:none;
  padding:10px;
}

/* 🏆 FINAL */
#final{
  display:none;
  padding:40px;
}

.score{
  font-size:22px;
  color:#4ade80;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- 🌍 INTRO -->
<div id="intro">
  <img class="planet" src="https://upload.wikimedia.org/wikipedia/commons/9/97/The_Earth_seen_from_Apollo_17.jpg">
  <h1>🌍 Planeta Ecosistema</h1>
  <p>Misión: restaurar el equilibrio del planeta</p>
  <button onclick="startGame()">🚀 Iniciar misión</button>
</div>

<!-- 🌌 MAPA -->
<div id="map"></div>

<!-- 📘 ZONA -->
<div id="zoneScreen">
  <h2 id="title"></h2>
  <div id="qbox"></div>
</div>

<!-- 🏆 FINAL -->
<div id="final">
  <h1>🏆 Ecosistema restaurado</h1>
  <p id="score" class="score"></p>
  <button onclick="copyResults()">📋 Copiar respuestas</button>
  
</div>

<script>
let current=0;
let score=0;
let totalTest=8;
let answers=[];
let respuestasAbiertas=[];

const zones=[
{
title:"🌱 Ecosistema",
questions:[
{type:"open", text:"Define con tus palabras qué es un ecosistema."},
{type:"test", text:"¿Qué incluye un ecosistema?",
options:["Solo seres vivos","Seres vivos + medio + relaciones"], correct:1}
]
},
{
title:"🌡️ Factores abióticos",
questions:[
{type:"open", text:"¿Qué es un factor abiótico? Pon un ejemplo."},
{type:"test", text:"El agua es:",
options:["Biótico","Abiótico"], correct:1}
]
},
{
title:"🔗 Relaciones",
questions:[
{type:"test", text:"Relación donde uno se alimenta de otro:",
options:["Mutualismo","Depredación"], correct:1},
{type:"open", text:"Explica mutualismo con un ejemplo."}
]
},
{
title:"🌿 Cadenas tróficas",
questions:[
{type:"test", text:"Orden correcto:",
options:["Productor→Consumidor","Consumidor→Productor"], correct:0},
{type:"open", text:"¿Qué pasa si desaparece una especie?"}
]
},
{
title:"🔺 Pirámides",
questions:[
{type:"test", text:"La energía:",
options:["Aumenta","Disminuye"], correct:1},
{type:"open", text:"Explica por qué hay menos energía arriba."}
]
},
{
title:"🌍 Impacto humano",
questions:[
{type:"test", text:"Acción negativa:",
options:["Reciclar","Deforestar"], correct:1},
{type:"open", text:"Propón una solución para proteger el ecosistema."}
]
},
{
title:"🌎 Tipos de ecosistemas",
questions:[
{type:"test", text:"¿Cuál es un ecosistema acuático?",
options:["Desierto","Océano"], correct:1},
{type:"open", text:"Explica dos diferencias entre ecosistemas terrestres y acuáticos."}
]
},
{
title:"🌱 Suelo y horizontes",
questions:[
{type:"test", text:"Horizonte con más materia orgánica:",
options:["Horizonte O","Horizonte C"], correct:0},
{type:"open", text:"Describe los horizontes del suelo desde la superficie hasta la roca madre."}
]
}
];

function startGame(){
  document.getElementById("intro").style.display="none";
  document.getElementById("map").style.display="block";
  renderMap();
}

function renderMap(){
  let html="<h2>🪐 Mapa del planeta</h2>";
  zones.forEach((z,i)=>{
    let locked=i>current;
    html+=`<div class="zone ${locked?'locked':''}" onclick="${!locked?'enterZone('+i+')':''}">
    ${z.title}</div>`;
  });
  document.getElementById("map").innerHTML=html;
}

function enterZone(i){
  document.getElementById("map").style.display="none";
  document.getElementById("zoneScreen").style.display="block";
  document.getElementById("title").innerText=zones[i].title;
  showQuestion(i,0);
}

function showQuestion(z,q){
  let data=zones[z].questions[q];
  let html="<p>"+data.text+"</p>";

  if(data.type==="test"){
    data.options.forEach((opt,i)=>{
      html+=`<button onclick="answerTest(${z},${q},${i})">${opt}</button><br>`;
    });
  }else{
    html+=`<textarea id="ans"></textarea>
    <br><button onclick="answerOpen(${z},${q})">Responder</button>`;
  }

  document.getElementById("qbox").innerHTML=html;
}

function answerTest(z,q,a){
  let data=zones[z].questions[q];

  answers.push(data.text+" → "+data.options[a]);

  if(a===data.correct){
    score++;
    alert("✅ Correcto");
  }else{
    alert("❌ Incorrecto");
  }

  next(z,q);
}

function answerOpen(z,q){
  let txt=document.getElementById("ans").value.trim();
  if(!txt){
    alert("✏️ Escribe una respuesta");
    return;
  }

  answers.push(zones[z].questions[q].text+" → "+txt);
  next(z,q);
  respuestasAbiertas.push(
  "Zona " + (z+1) + " - " +
  zones[z].questions[q].text +
  " → " + txt
);
}
  

function next(z,q){
  if(q+1<zones[z].questions.length){
    showQuestion(z,q+1);
  }else{
    current++;
    document.getElementById("zoneScreen").style.display="none";

    if(current>=zones.length){
      endGame();
    }else{
      document.getElementById("map").style.display="block";
      renderMap();
    }
  }
}

function endGame(){
  document.getElementById("final").style.display="block";
  let nota=(score/totalTest)*10;

document.getElementById("score").innerText =
"Aciertos test: " + score + " / " + totalTest;

document.getElementById("grade").innerText =
"Nota automática: " + nota.toFixed(1) + " / 10";
}

function copyResults() {
  let texto = "EVALUACIÓN ECOSISTEMAS\n\n";
  texto += "RESPUESTAS:\n\n";
  texto += answers.join("\n");

  const textarea = document.createElement("textarea");
  textarea.value = texto;
  document.body.appendChild(textarea);

  textarea.select();
  textarea.setSelectionRange(0, 99999);

  try {
    document.execCommand("copy");
    alert("📋 Respuestas copiadas correctamente");
  } catch (err) {
    alert("❌ No se pudo copiar automáticamente. Selecciona y copia manualmente.");
  }

  document.body.removeChild(textarea);
}
  function copyResults() {

  let texto = "EVALUACIÓN ECOSISTEMAS\n\n";

  texto += "TEST AUTOMÁTICO:\n";
  texto += "Aciertos: " + score + " / " + totalTest + "\n";
  texto += "Nota: " + ((score/totalTest)*10).toFixed(1) + "/10\n\n";

  texto += "RESPUESTAS ABIERTAS:\n\n";
  texto += respuestasAbiertas.join("\n");

  const textarea = document.createElement("textarea");
  textarea.value = texto;
  document.body.appendChild(textarea);

  textarea.select();
  textarea.setSelectionRange(0,99999);

  document.execCommand("copy");

  document.body.removeChild(textarea);

  alert("📋 Respuestas copiadas");
}
</script>

</body>
</html>
