<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Planeta Ecosistema</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Fredoka+One&display=swap" rel="stylesheet">

<style>
body{
font-family:'Nunito',sans-serif;
background:linear-gradient(135deg,#0f172a,#1e293b,#065f46);
background-size:400% 400%;
animation:bg 15s infinite;
color:white;
}

@keyframes bg{
0%,100%{background-position:0%}
50%{background-position:100%}
}

.font-title{font-family:'Fredoka One',cursive}

.zone{
transition:0.3s;
}
.zone:hover{transform:scale(1.05)}

.correct{background:#047857 !important}
.wrong{background:#991b1b !important}

.fade{animation:fade 0.5s}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>

<body class="h-screen flex flex-col">

<!-- INTRO -->
<div id="intro" class="flex flex-col items-center justify-center h-full text-center fade">
<div class="text-7xl mb-4">🌍</div>

<h1 class="font-title text-5xl text-emerald-300 mb-4">
Planeta Ecosistema
</h1>

<p class="mb-6 max-w-md">
Reconstruye el equilibrio del planeta superando desafíos científicos
</p>

<button onclick="startGame()" class="bg-emerald-500 px-8 py-4 rounded-xl font-bold text-lg hover:scale-105 transition">
🚀 Iniciar misión
</button>
</div>

<!-- MAPA -->
<div id="map" class="hidden p-6 text-center fade">

<h2 class="font-title text-3xl mb-6 text-emerald-300">
Mapa del planeta
</h2>

<div id="zones" class="grid grid-cols-2 md:grid-cols-3 gap-4 max-w-3xl mx-auto"></div>

<p id="score" class="mt-6 text-slate-300"></p>

</div>

<!-- ZONA -->
<div id="zone" class="hidden p-6 max-w-2xl mx-auto fade">

<button onclick="backMap()" class="mb-4 text-slate-400 hover:text-emerald-300">
⬅ Volver al mapa
</button>

<h2 id="zoneTitle" class="font-title text-2xl mb-4"></h2>

<div id="question" class="mb-4 text-lg"></div>

<div id="options" class="space-y-3"></div>

<div id="feedback" class="mt-4"></div>

<button id="continueBtn" onclick="finishZone()" class="hidden mt-6 bg-emerald-500 px-6 py-3 rounded-xl font-bold">
Continuar
</button>

</div>

<!-- FINAL -->
<div id="final" class="hidden flex flex-col items-center justify-center h-full text-center fade">

<div class="text-6xl mb-4">🏆</div>

<h1 class="font-title text-4xl text-yellow-300 mb-4">
¡Ecosistema restaurado!
</h1>

<p id="finalScore" class="text-lg mb-6"></p>

<button onclick="location.reload()" class="bg-emerald-500 px-8 py-4 rounded-xl font-bold">
Jugar otra vez
</button>

</div>

<script>

// ===== ESTADO =====
let state={
current:-1,
completed:[],
score:0
}

// ===== DATOS =====
const zones=[
{
title:"Ecosistema",
q:"¿Qué es un ecosistema?",
options:[
"Solo seres vivos",
"Seres vivos + medio + relaciones",
"Clima"
],
correct:1,
feedback:"Incluye biocenosis, biotopo y relaciones."
},
{
title:"Factores abióticos",
q:"¿El agua es?",
options:["Biótico","Abiótico","Ninguno"],
correct:1,
feedback:"No tiene vida."
},
{
title:"Relaciones",
q:"¿Depredación?",
options:["Mutualismo","Depredación","Comensalismo"],
correct:1,
feedback:"Uno se alimenta de otro."
},
{
title:"Cadena trófica",
q:"Orden correcto",
options:[
"Consumidor→Productor",
"Productor→Consumidor",
"Descomponedor→Productor"
],
correct:1,
feedback:"Siempre empieza en productores."
},
{
title:"Pirámide",
q:"La energía...",
options:["Aumenta","Disminuye","Igual"],
correct:1,
feedback:"Se pierde energía."
},
{
title:"Impacto humano",
q:"¿Qué daña ecosistemas?",
options:["Reservas","Deforestación","Reforestación"],
correct:1,
feedback:"Destruye hábitats."
}
];

// ===== NAVEGACIÓN =====
function show(screen){
["intro","map","zone","final"].forEach(s=>{
document.getElementById(s).classList.add("hidden")
})
document.getElementById(screen).classList.remove("hidden")
}

// ===== INICIO =====
function startGame(){
state.completed=[]
state.score=0
renderMap()
show("map")
}

// ===== MAPA =====
function renderMap(){
let html=""

zones.forEach((z,i)=>{

let unlocked=i===0||state.completed.includes(i-1)
let done=state.completed.includes(i)

html+=`
<div class="zone p-4 rounded-xl border 
${done?'bg-emerald-900':'bg-slate-800'}
${!unlocked?'opacity-40':''}"
onclick="${unlocked&&!done?`enterZone(${i})`:''}">

<div class="text-2xl mb-2">🌍</div>

<p class="font-bold">${z.title}</p>

<p class="text-xs">
${done?'✔ completado':unlocked?'Disponible':'Bloqueado'}
</p>

</div>
`
})

document.getElementById("zones").innerHTML=html
document.getElementById("score").innerText="Puntuación: "+state.score
}

// ===== ENTRAR ZONA =====
function enterZone(i){
state.current=i

let z=zones[i]

document.getElementById("zoneTitle").innerText=z.title
document.getElementById("question").innerText=z.q

let opts=""
z.options.forEach((o,idx)=>{
opts+=`
<div onclick="answer(${idx})"
class="p-3 bg-slate-700 rounded-xl cursor-pointer hover:bg-slate-600">
${o}
</div>`
})

document.getElementById("options").innerHTML=opts
document.getElementById("feedback").innerHTML=""
document.getElementById("continueBtn").classList.add("hidden")

show("zone")
}

// ===== RESPONDER =====
function answer(i){
let z=zones[state.current]
let buttons=document.querySelectorAll("#options div")

buttons.forEach((b,idx)=>{
if(idx===z.correct) b.classList.add("correct")
if(idx===i && idx!==z.correct) b.classList.add("wrong")
})

if(i===z.correct){
state.score++

document.getElementById("feedback").innerHTML=
"✅ Correcto<br>"+z.feedback

document.getElementById("continueBtn").classList.remove("hidden")

}else{
document.getElementById("feedback").innerHTML=
"❌ Incorrecto<br>"+z.feedback
}
}

// ===== FINALIZAR ZONA =====
function finishZone(){

if(!state.completed.includes(state.current)){
state.completed.push(state.current)
}

if(state.completed.length===zones.length){
endGame()
}else{
renderMap()
show("map")
}
}

// ===== VOLVER =====
function backMap(){
show("map")
}

// ===== FINAL =====
function endGame(){
document.getElementById("finalScore").innerText=
"Puntuación: "+state.score+" / "+zones.length

show("final")
}

</script>

</body>
</html>
