<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planeta Ecosistema</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#020617;
  color:white;
}

/* fondo */
body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:radial-gradient(circle,#0b1f3a,#020617);
  z-index:-1;
}

/* pantallas */
.screen{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
}
.active{display:flex}

/* planeta inicio */
.earth{
  width:220px;
  height:220px;
  border-radius:50%;
  background:url("https://eoimages.gsfc.nasa.gov/images/imagerecords/57000/57730/land_ocean_ice_2048.png");
  background-size:cover;
  animation:spin 40s linear infinite;
}
@keyframes spin{
  from{background-position:0}
  to{background-position:1000px}
}

/* botón */
.btn{
  margin-top:20px;
  padding:12px 25px;
  background:#10b981;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

/* mapa */
.map{
  width:350px;
  height:350px;
  border-radius:50%;
  background:#065f46;
  position:relative;
}

/* zonas */
.zone{
  position:absolute;
  width:60px;
  height:60px;
  border-radius:50%;
  background:#064e3b;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  border:2px solid #10b981;
  transition:0.3s;
}
.zone:hover{transform:scale(1.1)}

.locked{
  opacity:0.3;
  pointer-events:none;
}

/* pregunta */
.box{
  background:#0f172a;
  padding:20px;
  border-radius:10px;
  max-width:400px;
}

.option{
  margin:10px;
  padding:10px;
  background:#1e293b;
  border-radius:8px;
  cursor:pointer;
}
.option:hover{background:#334155}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro" class="screen active">
<div class="earth"></div>
<h1>🌍 Planeta Ecosistema</h1>
<p>Debes restaurar el equilibrio del planeta superando cada zona.</p>
<button class="btn" onclick="start()">🚀 Iniciar misión</button>
</div>

<!-- MAPA -->
<div id="map" class="screen">
<h2>🪐 Mapa del planeta</h2>

<div class="map">

<div class="zone" onclick="openQ(0)" style="top:10px;left:140px">🌱</div>
<div id="z1" class="zone locked" onclick="openQ(1)" style="top:80px;left:260px">🌡️</div>
<div id="z2" class="zone locked" onclick="openQ(2)" style="top:220px;left:220px">🔗</div>
<div id="z3" class="zone locked" onclick="openQ(3)" style="top:220px;left:60px">🌿</div>
<div id="z4" class="zone locked" onclick="openQ(4)" style="top:80px;left:20px">🔺</div>
<div id="z5" class="zone locked" onclick="openQ(5)" style="top:150px;left:140px">🌍</div>

</div>

<p>🔓 Completa cada zona para desbloquear la siguiente</p>
</div>

<!-- PREGUNTAS -->
<div id="game" class="screen">
<div class="box">
<h3 id="question"></h3>
<div id="answers"></div>
<button class="btn" onclick="back()">⬅ Volver al mapa</button>
</div>
</div>

<script>

let current = 0;
let unlocked = [true,false,false,false,false,false];

const data = [
{q:"¿Qué es un ecosistema?",a:["Solo seres vivos","Seres vivos + medio + relaciones","Clima"],c:1},
{q:"¿Factor abiótico?",a:["Planta","Agua","Animal"],c:1},
{q:"Relación depredador?",a:["Mutualismo","Depredación","Comensalismo"],c:1},
{q:"Inicio cadena?",a:["Consumidor","Productor","Descomponedor"],c:1},
{q:"Energía?",a:["Aumenta","Disminuye","Igual"],c:1},
{q:"Impacto humano?",a:["Reforestar","Deforestar","Proteger"],c:1}
];

function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function start(){
  show("map");
}

function openQ(n){
  if(!unlocked[n]) return;
  current = n;
  load();
  show("game");
}

function load(){
  let q = data[current];
  document.getElementById("question").innerText = q.q;

  let html="";
  q.a.forEach((op,i)=>{
    html += `<div class="option" onclick="check(${i})">${op}</div>`;
  });

  document.getElementById("answers").innerHTML = html;
}

function check(i){
  let q = data[current];

  if(i === q.c){
    alert("✅ ¡Correcto! Zona completada");

    // desbloquear siguiente
    if(current < 5){
      unlocked[current+1] = true;
      document.getElementById("z"+(current+1)).classList.remove("locked");
    }

    show("map");

  }else{
    alert("❌ Incorrecto, intenta otra vez");
  }
}

function back(){
  show("map");
}

</script>

</body>
</html>
