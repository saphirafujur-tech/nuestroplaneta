<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planeta Ecosistema PRO</title>

<style>

/* ====== BASE ====== */
body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background:#020617;
  color:white;
  overflow:hidden;
}

/* ====== ESTRELLAS ====== */
.stars{
  position:fixed;
  width:100%;
  height:100%;
  background:url("https://www.transparenttextures.com/patterns/stardust.png"),
             radial-gradient(circle at center, #0b1f3a, #020617);
  z-index:-1;
}

/* ====== PANTALLAS ====== */
.screen{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
}

.active{ display:flex; }

/* ====== PLANETA ====== */
.earth{
  width:260px;
  height:260px;
  border-radius:50%;
  background:url("https://eoimages.gsfc.nasa.gov/images/imagerecords/57000/57730/land_ocean_ice_2048.png");
  background-size:cover;
  animation:rotateEarth 40s linear infinite;
  box-shadow: inset -40px -40px 60px rgba(0,0,0,0.6);
}

@keyframes rotateEarth{
  from{background-position:0 0;}
  to{background-position:1000px 0;}
}

/* ====== TEXTO ====== */
.title{ font-size:42px; color:#6ee7b7; }
.subtitle{ color:#34d399; }

.btn{
  padding:15px 30px;
  border:none;
  border-radius:12px;
  background:#10b981;
  color:#022c22;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 20px #10b981;
}

/* ====== MAPA ====== */
.map{
  width:420px;
  height:420px;
  border-radius:50%;
  background:radial-gradient(circle,#065f46,#022c22);
  position:relative;
  box-shadow:0 0 60px #10b981;
}

.zone{
  position:absolute;
  width:70px;
  height:70px;
  border-radius:50%;
  background:#064e3b;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  border:2px solid #10b981;
  transition:0.3s;
}

.zone:hover{ transform:scale(1.1); }

.locked{
  opacity:0.3;
  pointer-events:none;
}

/* ====== NAVE ====== */
.ship{
  position:absolute;
  font-size:28px;
  transition:all 1s ease;
}

/* ====== PREGUNTAS ====== */
.box{
  background:#0f172a;
  padding:20px;
  border-radius:10px;
  max-width:500px;
}

.option{
  margin:10px;
  padding:12px;
  background:#1e293b;
  border-radius:8px;
  cursor:pointer;
}

.option:hover{ background:#334155; }

/* ====== PROGRESO ====== */
.progress{
  position:absolute;
  top:20px;
  width:200px;
  height:10px;
  background:#1e293b;
  border-radius:10px;
}

.bar{
  height:100%;
  width:0%;
  background:#10b981;
  border-radius:10px;
  transition:0.5s;
}

</style>
</head>

<body>

<div class="stars"></div>

<!-- INTRO -->
<div id="intro" class="screen active">
<div class="earth"></div>
<h1 class="title">Planeta Ecosistema</h1>
<p class="subtitle">Misión de Supervivencia</p>
<button class="btn" onclick="startGame()">🚀 Iniciar misión</button>
</div>

<!-- MAPA -->
<div id="mapScreen" class="screen">

<div class="progress"><div class="bar" id="bar"></div></div>

<div class="map" id="map">

<div class="zone" style="top:20px; left:180px" onclick="openZone(0)">🌱</div>
<div class="zone locked" id="z1" style="top:100px; left:320px" onclick="openZone(1)">🌡️</div>
<div class="zone locked" id="z2" style="top:280px; left:260px" onclick="openZone(2)">🔗</div>
<div class="zone locked" id="z3" style="top:280px; left:80px" onclick="openZone(3)">🌿</div>
<div class="zone locked" id="z4" style="top:100px; left:40px" onclick="openZone(4)">🔺</div>
<div class="zone locked" id="z5" style="top:180px; left:180px" onclick="openZone(5)">🌍</div>

<div class="ship" id="ship">🚀</div>

</div>

</div>

<!-- GAME -->
<div id="game" class="screen">
<div class="box">
<h3 id="q"></h3>
<div id="opts"></div>
</div>
</div>

<script>

/* ====== SONIDOS ====== */
const okSound = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3");
const failSound = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-946.mp3");

/* ====== DATOS ====== */
let current = 0;
let progress = 0;

const data = [
{q:"¿Qué es un ecosistema?",o:["Solo seres vivos","Seres vivos + medio + relaciones","Clima"],c:1},
{q:"¿Factor abiótico?",o:["Planta","Agua","Animal"],c:1},
{q:"Relación depredador?",o:["Mutualismo","Depredación","Comensalismo"],c:1},
{q:"Inicio cadena?",o:["Consumidor","Productor","Descomponedor"],c:1},
{q:"Energía?",o:["Aumenta","Disminuye","Igual"],c:1},
{q:"Impacto humano?",o:["Reforestar","Deforestar","Proteger"],c:1}
];

/* ====== FUNCIONES ====== */
function startGame(){
  show("mapScreen");
  moveShip(0);
}

function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function openZone(n){
  current=n;
  loadQ();
  show("game");
}

function loadQ(){
  let q=data[current];
  document.getElementById("q").innerText=q.q;

  let html="";
  q.o.forEach((opt,i)=>{
    html+=`<div class="option" onclick="check(${i})">${opt}</div>`;
  });

  document.getElementById("opts").innerHTML=html;
}

function check(i){
  let q=data[current];

  if(i===q.c){
    okSound.play();
    progress++;
    updateBar();
    unlock();
    moveShip(current+1);
    setTimeout(()=>show("mapScreen"),800);
  }else{
    failSound.play();
    alert("❌ Intenta otra vez");
  }
}

function unlock(){
  if(current<5){
    document.getElementById("z"+current).classList.remove("locked");
  }
}

function updateBar(){
  document.getElementById("bar").style.width=(progress/6*100)+"%";
}

function moveShip(n){
  const zones=document.querySelectorAll(".zone");
  const ship=document.getElementById("ship");

  if(zones[n]){
    let rect=zones[n].getBoundingClientRect();
    let mapRect=document.getElementById("map").getBoundingClientRect();

    ship.style.left=(rect.left-mapRect.left+20)+"px";
    ship.style.top=(rect.top-mapRect.top-10)+"px";
  }
}

</script>

</body>
</html>
