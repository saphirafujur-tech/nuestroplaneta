<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Planeta Ecosistema</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Fredoka+One&display=swap" rel="stylesheet">

<style>
body{
font-family:'Nunito',sans-serif;
background:linear-gradient(135deg,#0f172a,#1e293b,#065f46);
color:white;
}

.font-title{font-family:'Fredoka One',cursive;}

.card{
background:rgba(30,41,59,0.7);
border:1px solid rgba(16,185,129,0.3);
border-radius:16px;
padding:16px;
margin:10px;
cursor:pointer;
transition:0.3s;
}
.card:hover{transform:scale(1.05)}

.btn{
background:#10b981;
color:#022c22;
padding:10px 20px;
border-radius:12px;
font-weight:bold;
cursor:pointer;
}

.correct{background:#047857!important}
.wrong{background:#991b1b!important}

.hidden{display:none}
</style>
</head>

<body class="p-4">

<!-- INTRO -->
<div id="intro" class="text-center">
<h1 class="font-title text-4xl mb-4">🌍 Planeta Ecosistema</h1>
<p class="mb-6">Misión de supervivencia</p>
<button onclick="startGame()" class="btn">🚀 Iniciar misión</button>
</div>

<!-- MAPA -->
<div id="map" class="hidden text-center">
<h2 class="font-title text-2xl mb-4">Mapa del planeta</h2>

<div id="zones" class="grid grid-cols-2 md:grid-cols-3"></div>

<button onclick="copyAnswers()" class="btn mt-6">
📋 Copiar respuestas
</button>
</div>

<!-- ZONA -->
<div id="zone" class="hidden max-w-xl mx-auto">

<h2 id="zoneTitle" class="font-title text-2xl mb-2"></h2>

<img id="zoneImg" class="rounded-xl mb-4 w-full max-h-48 object-cover">

<!-- PREGUNTA 1 -->
<p id="q1" class="font-bold mb-2"></p>
<div id="options" class="space-y-2"></div>
<p id="feedback1" class="mt-2"></p>

<!-- PREGUNTA 2 -->
<div id="q2block" class="hidden mt-4">
<p id="q2" class="font-bold mb-2"></p>
<textarea id="input" class="w-full p-2 rounded text-black"></textarea>
<button onclick="answerQ2()" class="btn mt-2">Responder</button>
<p id="feedback2"></p>
</div>

<button id="finishBtn" onclick="finishZone()" class="btn mt-4 hidden">
Volver al mapa
</button>

</div>

<script>

// ESTADO
let state={
current:-1,
completed:[],
answers:{}
}

// DATOS
const zones=[
{
title:"Ecosistema",
img:"https://upload.wikimedia.org/wikipedia/commons/thumb/6/68/Ecosystem.jpg/640px-Ecosystem.jpg",
q1:"¿Qué es un ecosistema?",
options:[
"Solo seres vivos",
"Seres vivos + medio + relaciones",
"Solo clima"
],
correct:1,
q2:"¿El agua es biótica o abiótica?"
},
{
title:"Cadena trófica",
img:"https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/Food_chain.svg/640px-Food_chain.svg.png",
q1:"¿Quién produce energía?",
options:[
"Productores",
"Consumidores",
"Descomponedores"
],
correct:0,
q2:"¿Qué ocurre si desaparece un eslabón?"
},
{
title:"Relaciones",
img:"https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Mutualism.jpg/640px-Mutualism.jpg",
q1:"¿Qué es el mutualismo?",
options:[
"Uno gana y otro pierde",
"Ambos se benefician",
"Nadie gana"
],
correct:1,
q2:"Pon un ejemplo de relación entre seres vivos"
}
]

// NAVEGACIÓN
function show(screen){
["intro","map","zone"].forEach(s=>{
document.getElementById(s).classList.add("hidden")
})
document.getElementById(screen).classList.remove("hidden")
}

// INICIO
function startGame(){
renderMap()
show("map")
}

// MAPA
function renderMap(){
let html=""

zones.forEach((z,i)=>{

let unlocked = i===0 || state.completed.includes(i-1)
let done = state.completed.includes(i)

html+=`
<div class="card"
onclick="${unlocked && !done ? `enterZone(${i})` : ''}">
🌍 ${z.title}
${done ? "✅" : unlocked ? "🟢" : "🔒"}
</div>
`
})

document.getElementById("zones").innerHTML=html
}

// ENTRAR ZONA
function enterZone(i){

// RESET TOTAL (SOLUCION BUG)
document.getElementById("options").innerHTML=""
document.getElementById("feedback1").innerHTML=""
document.getElementById("feedback2").innerHTML=""
document.getElementById("input").value=""
document.getElementById("q2block").classList.add("hidden")
document.getElementById("finishBtn").classList.add("hidden")

state.current=i
let z=zones[i]

document.getElementById("zoneTitle").innerText=z.title
document.getElementById("zoneImg").src=z.img
document.getElementById("q1").innerText=z.q1

z.options.forEach((opt,index)=>{
let btn=document.createElement("div")
btn.className="card"
btn.innerText=opt
btn.onclick=()=>answerQ1(index)
document.getElementById("options").appendChild(btn)
})

show("zone")
}

// RESPUESTA TEST
function answerQ1(i){

let z=zones[state.current]
let buttons=document.querySelectorAll("#options div")

buttons.forEach((b,idx)=>{
if(idx===z.correct)b.classList.add("correct")
if(idx===i && idx!==z.correct)b.classList.add("wrong")
})

if(i===z.correct){

document.getElementById("feedback1").innerText="✅ Correcto"

state.answers["Zona "+(state.current+1)+" - Test"]=z.options[i]

// desbloquear siguiente
document.getElementById("q2block").classList.remove("hidden")
document.getElementById("q2").innerText=z.q2

}else{
document.getElementById("feedback1").innerText="❌ Incorrecto"
}
}

// RESPUESTA ABIERTA
function answerQ2(){

let txt=document.getElementById("input").value

state.answers["Zona "+(state.current+1)+" - Abierta"]=txt

document.getElementById("feedback2").innerText="Respuesta guardada ✅"

document.getElementById("finishBtn").classList.remove("hidden")
}

// FINALIZAR
function finishZone(){
state.completed.push(state.current)
renderMap()
show("map")
}

// COPIAR RESPUESTAS
function copyAnswers(){

let text="RESPUESTAS DEL ALUMNO\n\n"

for(let k in state.answers){
text+=k+":\n"+state.answers[k]+"\n\n"
}

navigator.clipboard.writeText(text)

alert("Respuestas copiadas 👍")
}

</script>

</body>
</html>
