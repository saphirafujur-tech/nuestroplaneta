<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planeta Ecosistema</title>

<style>

/* ================== RESET ================== */
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#020617;
  color:white;
  overflow:hidden;
}

/* ================== ESTRELLAS ================== */
.stars{
  position:fixed;
  width:100%;
  height:100%;
  background:url("https://www.transparenttextures.com/patterns/stardust.png"),
             radial-gradient(circle at center, #0b1f3a, #020617);
  z-index:-1;
}

/* ================== PANTALLAS ================== */
.screen{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
}

.active{
  display:flex;
}

/* ================== PLANETA INTRO ================== */
.earth-container{
  position:relative;
  margin-top:40px;
}

.earth{
  width:260px;
  height:260px;
  border-radius:50%;
  background-image:url("https://eoimages.gsfc.nasa.gov/images/imagerecords/57000/57730/land_ocean_ice_2048.png");
  background-size:cover;
  animation:rotateEarth 40s linear infinite;
  box-shadow: inset -40px -40px 60px rgba(0,0,0,0.6);
}

@keyframes rotateEarth{
  from{background-position:0 0;}
  to{background-position:1000px 0;}
}

.glow{
  position:absolute;
  width:300px;
  height:300px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(0,255,150,0.4), transparent);
  top:-20px;
  left:-20px;
  filter:blur(25px);
}

/* ================== TEXTOS ================== */
.title{
  font-size:42px;
  color:#6ee7b7;
  margin-top:20px;
}

.subtitle{
  color:#34d399;
}

.intro-box{
  max-width:500px;
  background:rgba(15,23,42,0.7);
  padding:20px;
  border-radius:15px;
  margin:20px;
}

/* ================== BOTÓN ================== */
.btn{
  padding:15px 30px;
  border:none;
  border-radius:12px;
  background:#10b981;
  color:#022c22;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 15px #10b981;
  transition:0.3s;
}

.btn:hover{
  transform:scale(1.1);
}

/* ================== MAPA ================== */
.planet-map{
  width:400px;
  height:400px;
  border-radius:50%;
  background:radial-gradient(circle, #065f46, #022c22);
  position:relative;
  box-shadow:0 0 60px #10b981;
}

.zone{
  position:absolute;
  width:70px;
  height:70px;
  border-radius:50%;
  background:#064e3b;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  border:2px solid #10b981;
}

.locked{
  opacity:0.3;
  pointer-events:none;
}

/* ================== PREGUNTAS ================== */
.question-box{
  background:#0f172a;
  padding:20px;
  border-radius:10px;
  max-width:500px;
}

.option{
  margin:10px;
  padding:10px;
  background:#1e293b;
  border-radius:8px;
  cursor:pointer;
}

.correct{ background:green; }
.wrong{ background:red; }

</style>
</head>

<body>

<div class="stars"></div>

<!-- ================= INTRO ================= -->
<div id="intro" class="screen active">

<div class="earth-container">
  <div class="earth"></div>
  <div class="glow"></div>
</div>

<h1 class="title">Planeta Ecosistema</h1>
<p class="subtitle">Misión de Supervivencia</p>

<div class="intro-box">
Habéis llegado a un planeta sin equilibrio.<br>
Debéis reconstruir su ecosistema superando desafíos.
</div>

<button class="btn" onclick="startGame()">🚀 Iniciar misión</button>

</div>

<!-- ================= MAPA ================= -->
<div id="map" class="screen">

<h2>🌍 Mapa del planeta</h2>

<div class="planet-map">

<div class="zone" style="top:20px; left:160px" onclick="openZone(0)">1</div>
<div class="zone locked" id="z1" style="top:120px; left:300px" onclick="openZone(1)">2</div>
<div class="zone locked" id="z2" style="top:280px; left:250px" onclick="openZone(2)">3</div>
<div class="zone locked" id="z3" style="top:280px; left:80px" onclick="openZone(3)">4</div>
<div class="zone locked" id="z4" style="top:120px; left:40px" onclick="openZone(4)">5</div>
<div class="zone locked" id="z5" style="top:180px; left:160px" onclick="openZone(5)">6</div>

</div>

</div>

<!-- ================= PREGUNTAS ================= -->
<div id="game" class="screen">

<div class="question-box">
<h3 id="question"></h3>

<div id="options"></div>

</div>

</div>

<script>

/* ================= DATOS ================= */
let currentZone = 0;

const questions = [
{
q:"¿Qué es un ecosistema?",
options:[
"Solo seres vivos",
"Seres vivos + medio + relaciones",
"Solo clima"
],
correct:1
},
{
q:"¿Factor abiótico?",
options:["Planta","Agua","Animal"],
correct:1
},
{
q:"Relación depredador-presa?",
options:["Mutualismo","Depredación","Comensalismo"],
correct:1
},
{
q:"Inicio cadena trófica?",
options:["Consumidor","Productor","Descomponedor"],
correct:1
},
{
q:"Energía en pirámide?",
options:["Aumenta","Disminuye","Igual"],
correct:1
},
{
q:"Impacto humano negativo?",
options:["Reforestar","Deforestar","Proteger"],
correct:1
}
];

/* ================= FUNCIONES ================= */

function startGame(){
  show("map");
}

function show(screen){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(screen).classList.add("active");
}

function openZone(n){
  currentZone = n;
  loadQuestion();
  show("game");
}

function loadQuestion(){
  let q = questions[currentZone];
  document.getElementById("question").innerText = q.q;

  let optionsHTML = "";
  q.options.forEach((opt,i)=>{
    optionsHTML += `<div class="option" onclick="checkAnswer(${i})">${opt}</div>`;
  });

  document.getElementById("options").innerHTML = optionsHTML;
}

function checkAnswer(i){
  let q = questions[currentZone];

  if(i === q.correct){
    alert("✅ Correcto");
    unlockNext();
  } else {
    alert("❌ Intenta otra vez");
    return; // 🔥 IMPORTANTE: no avanza si falla
  }

  show("map");
}

function unlockNext(){
  if(currentZone < 5){
    document.getElementById("z"+currentZone).classList.remove("locked");
  }
}

</script>

</body>
</html>
