<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Planeta Ecosistema</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
font-family:sans-serif;
background:linear-gradient(135deg,#0f172a,#1e293b,#065f46);
color:white;
}

.btn{
background:#10b981;
padding:10px 16px;
border-radius:10px;
cursor:pointer;
margin-top:10px;
}

.correct{background:#047857 !important}
.wrong{background:#991b1b !important}
.hidden{display:none}
</style>
</head>

<body class="p-4">

<!-- INTRO -->
<div id="intro">
<h1 class="text-3xl mb-4">🌍 Planeta Ecosistema</h1>
<button onclick="startGame()" class="btn">Iniciar</button>
</div>

<!-- MAPA -->
<div id="map" class="hidden">
<h2 class="text-xl mb-4">Mapa</h2>
<div id="zones"></div>
<button onclick="copiarRespuestas()" class="btn">📋 Copiar respuestas</button>
</div>

<!-- ZONA -->
<div id="zone" class="hidden">

<h2 id="zoneTitle"></h2>

<!-- IMAGEN -->
<img id="zoneImg" class="my-3 rounded-xl max-h-40">

<!-- PREGUNTA 1 -->
<p id="q1"></p>
<div id="opts"></div>
<p id="fb1"></p>

<!-- PREGUNTA 2 -->
<div id="q2block" class="hidden">
<p id="q2"></p>
<textarea id="input"></textarea>
<button onclick="answerQ2()" class="btn">Responder</button>
<p id="fb2"></p>
</div>

<button id="finish" onclick="finishZone()" class="btn hidden">
Volver
</button>

</div>

<script>

let state={
current:-1,
completed:[],
answers:{}
}

// DATOS
const zones=[
{
title:"Ecosistema",
img:"https://upload.wikimedia.org/wikipedia/commons/thumb/6/68/Ecosystem.jpg/640px-Ecosystem.jpg",
q1:"¿Qué es un ecosistema?",
options:["Seres vivos","Seres vivos + medio + relaciones","Clima"],
correct:1,
q2:"¿El agua es biótica o abiótica?"
},
{
title:"Cadena trófica",
img:"https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/Food_chain.svg/640px-Food_chain.svg.png",
q1:"¿Quién produce energía?",
options:["Productor","Consumidor","Descomponedor"],
correct:0,
q2:"¿Qué pasa si desaparece un eslabón?"
}
]

// NAVEGACIÓN
function show(s){
["intro","map","zone"].forEach(id=>{
document.getElementById(id).classList.add("hidden")
})
document.getElementById(s).classList.remove("hidden")
}

// INICIO
function startGame(){
renderMap()
show("map")
}

// MAPA
function renderMap(){
let html=""
zones.forEach((z,i)=>{
let unlocked=i===0||state.completed.includes(i-1)

html+=`
<div onclick="${unlocked?`enterZone(${i})`:''}"
style="margin:10px;padding:10px;border:1px solid white;cursor:pointer">
🌍 ${z.title}
</div>`
})
document.getElementById("zones").innerHTML=html
}

// ENTRAR ZONA
function enterZone(i){

// 🔥 RESET TOTAL (CLAVE)
document.getElementById("opts").innerHTML=""
document.getElementById("fb1").innerHTML=""
document.getElementById("fb2").innerHTML=""
document.getElementById("input").value=""
document.getElementById("q2block").classList.add("hidden")
document.getElementById("finish").classList.add("hidden")

state.current=i
let z=zones[i]

document.getElementById("zoneTitle").innerText=z.title
document.getElementById("zoneImg").src=z.img
document.getElementById("q1").innerText=z.q1

z.options.forEach((o,idx)=>{
let btn=document.createElement("div")
btn.innerText=o
btn.className="btn"
btn.onclick=()=>answerQ1(idx)
document.getElementById("opts").appendChild(btn)
})

show("zone")
}

// RESPUESTA 1
function answerQ1(i){
let z=zones[state.current]
let opts=document.querySelectorAll("#opts div")

opts.forEach((b,idx)=>{
if(idx===z.correct)b.classList.add("correct")
if(idx===i && idx!==z.correct)b.classList.add("wrong")
})

if(i===z.correct){
document.getElementById("fb1").innerText="✅ Correcto"

state.answers["Zona "+(state.current+1)+" - Test"]=
z.options[i]

// desbloquear siguiente
document.getElementById("q2block").classList.remove("hidden")
document.getElementById("q2").innerText=z.q2

}else{
document.getElementById("fb1").innerText="❌ Incorrecto"
}
}

// RESPUESTA 2
function answerQ2(){
let txt=document.getElementById("input").value

state.answers["Zona "+(state.current+1)+" - Abierta"]=txt

document.getElementById("fb2").innerText="Respuesta guardada"

document.getElementById("finish").classList.remove("hidden")
}

// FINALIZAR
function finishZone(){
state.completed.push(state.current)
renderMap()
show("map")
}

// COPIAR RESPUESTAS
function copiarRespuestas(){

let texto="RESPUESTAS ALUMNO\n\n"

for(let k in state.answers){
texto+=k+":\n"+state.answers[k]+"\n\n"
}

navigator.clipboard.writeText(texto)

alert("Copiado 👍")
}

</script>

</body>
</html>
